name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Kiểm tra trên Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Cài phụ thuộc
        run: npm ci

      - name: Tải qpdf và tài nguyên PDF.js
        run: npm run assets --workspace @optb/desktop

      - name: Sinh bộ tệp kiểm thử
        run: npm run fixtures --workspace @optb/desktop

      - name: Kiểm tra kiểu
        run: npm run typecheck --workspace @optb/desktop

      - name: Lint
        run: npm run lint --workspace @optb/desktop

      - name: Kiểm thử đơn vị
        run: npm test --workspace @optb/desktop

      - name: Kiểm tra tương phản WCAG AA (design token)
        run: npx vite-node --config vite.scripts.config.ts tests/scripts/contrast-check.mjs
        working-directory: apps/desktop

      - name: Dựng gói
        run: npm run package --workspace @optb/desktop

      - name: Kiểm thử đầu-cuối
        run: npm run test:e2e --workspace @optb/desktop

      - name: Đóng gói MSIX cho Microsoft Store
        run: npm run make --workspace @optb/desktop
        env:
          OPTB_BUILD_MSIX: '1'
          MSIX_IDENTITY_NAME: 'MTDStudio.OfflinePDFToolbox'
          MSIX_PUBLISHER: 'CN=F6CFEAEE-C755-4C7E-BDC5-FD89DA169656'
          MSIX_PUBLISHER_DISPLAY_NAME: 'MTD Studio'

      - name: Lưu gói phát hành MSIX
        uses: actions/upload-artifact@v4
        with:
          name: offline-pdf-toolbox-msix
          path: apps/desktop/out/make/**/*.msix
          if-no-files-found: ignore

      - name: Tải báo cáo kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
